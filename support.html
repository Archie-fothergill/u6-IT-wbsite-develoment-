<!DOCTYPE html>
<html>

<head>
<title>Support Team</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f6fa;
}

/* Flexible Page Layout */

.page-content {
    flex: 1;
}

/* For pages with sticky footer */

body.flex-page {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* Headings */

h1 {
    text-align: center;
    color: #1f2a44;
    margin-top: 30px;
}

h2 {
    color: #1f2a44;
}

h2, p {
    margin: 10px;
}

/* Navigation */

ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #1f2a44;
}

ul li {
    float: left;
}

ul li a {
    display: block;
    color: white;
    text-align: center;
    padding: 16px 18px;
    text-decoration: none;
    font-weight: bold;
}

ul li a:hover {
    background-color: #4a6fa5;
}

/* Main Containers */

.container {
    display: flex;
    width: 90%;
    margin: 30px auto;
    gap: 20px;
    flex-wrap: wrap;
}

.box {
    width: 48%;
    padding: 25px;
    box-sizing: border-box;
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.image-box,
.center-box {
    width: 70%;
    margin: 40px auto;
    padding: 25px;
    background-color: white;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* Staff Section */

.staff-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    width: 90%;
    margin: 40px auto;
}

.staff-box {
    background-color: white;
    padding: 25px;
    text-align: center;
    border-radius: 8px;
    transition: 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.staff-link {
    text-decoration: none;
    color: black;
}

.staff-link:hover .staff-box {
    transform: translateY(-5px);
}

/* Forms */

input,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

button {
    background-color: #1f2a44;
    color: white;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 4px;
}

button:hover {
    background-color: #4a6fa5;
}

/* Footer */

.footer {
    background-color: #1f2a44;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 25px;
    margin-top: auto;
}

.footer-column {
    width: 33%;
}

.footer-column h3 {
    margin-top: 0;
}

.footer-column p {
    font-size: 14px;
}
</style>
</head>

<p>
